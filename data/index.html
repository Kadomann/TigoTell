<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigoTell Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    h2 {
      margin-bottom: 1.5rem;
    }

    .header-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .header-pill:has(> img:only-child) {
      padding: 0.5rem;
    }

    .header-pill.status-live {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
    }

    .header-pill.status-stale {
      background: var(--stale-bg);
      color: var(--warning);
    }

    .header-pill.status-disconnected {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    #update-available-badge {
      display: none;
      background: var(--primary);
      color: white;
      font-weight: bold;
      white-space: nowrap;
      text-transform: uppercase;
    }

    #status-badge {
      cursor: default;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: currentColor;
      border-radius: 50%;
    }

    .status-dot.pulse {
      animation: pulse 0.8s ease-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .stat-card-header {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .stat-label {
      display: flex;
      align-items: center;
      white-space: nowrap;
      gap: 0.5rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-label::before {
      content: '';
      display: block;
      width: 1.2rem;
      height: 1.2rem;
      background-image: var(--card-icon);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: invert(1) brightness(1.5);
      opacity: 0.6;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    section {
      margin-bottom: 3rem;
    }

    .power-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .power-card {
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 1.25rem;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .power-card .node-id {
      color: var(--accent);
    }

    .power-card.stale {
      border-color: var(--warning);
    }

    .stale-badge {
      display: none;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      background: var(--stale-bg);
      color: var(--warning);
      padding: .25rem .5rem;
      border-radius: .25rem;
    }

    .power-card.stale .stale-badge {
      display: inline-block;
    }

    .card-body {
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .metric {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .node-id {
      font-weight: 700;
    }

    .barcode {
      font-family: monospace;
      color: var(--accent);
    }

    .address {
      font-family: monospace;
    }

    .power-card .address {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .power-card .address::before {
      content: 'Addr: ';
      /* font-family: var(--font-family); */
    }

    .power-card .updated {
      font-size: 0.75rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
      margin-top: 0.5rem;
      display: none;
      justify-content: space-between;
      align-items: center;
    }

    .power-card.stale .updated {
      display: flex;
    }

    .power-card .updated .timestamp::before {
      content: 'Updated: ';
    }

    .card-barcode {
      font-family: monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-left: 0.6rem;
      padding: 0.1rem 0.4rem;
      border-radius: 0.25rem;
      background: rgba(255, 255, 255, 0.07);
    }

    .barcode-fragment {
      font-family: monospace;
    }

    .last-seen {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .tap-state {
      font-weight: 600;
      font-size: 0.75rem;
      padding: .25rem .5rem;
      border-radius: .25rem;
    }

    .tap-state.ok {
      background: rgba(109, 173, 18, 0.12);
      color: var(--success);
    }

    .tap-state.degraded {
      background: var(--stale-bg);
      color: var(--warning);
    }

    .tap-state.offline {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    .health-alert {
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      border-color: rgba(234, 179, 8, 0.45);
      color: var(--warning);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .health-alert strong {
      display: block;
      margin-bottom: 0.25rem;
    }

    .tap-card .wide {
      grid-column: 1 / -1;
    }

    .tap-card .wide .metric-value {
      font-size: 0.875rem;
      font-weight: 500;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      .power-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div>
        <h1>TigoTell Dashboard</h1>
        <p id="build-version-info"
          style="font-size: 0.75rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.5rem; white-space: nowrap;">
          <span id="build-version">Loading...</span>
        </p>
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <div id="status-badge" class="header-pill status-live">
          <div id="status-dot" class="status-dot"></div>
          <span id="status-text">Loading...</span>
        </div>
        <div id="mqtt-badge" class="header-pill" style="display: none; cursor: default;">MQTT</div>
        <a id="update-available-badge" class="header-pill">Update
          Available</a>
        <a id="update-check-btn" class="header-pill" title="Check for updates">
          <img src="images/material-design/upload-network.svg"
            style="width: 1.25rem; height: 1.25rem; filter: invert(0.8); display: block;">
        </a>
        <a href="/layout.html" class="header-pill" title="System layout">
          <img src="images/layout.svg"
            style="width: 1.25rem; height: 1.25rem; filter: invert(0.8); display: block;">
        </a>
        <a href="/config.html" class="header-pill" title="Settings">
          <img src="images/material-design/cog.svg"
            style="width: 1.25rem; height: 1.25rem; filter: invert(0.8); display: block;">
        </a>
      </div>
    </header>

    <div class="card health-alert" id="health-alert" style="display: none;"></div>

    <section>
      <div class="stats-grid">
        <div class="card stat-card" style="--card-icon: url('images/material-design/solar-power.svg');">
          <div class="stat-card-header">
            <span class="stat-label">Current Power</span>
          </div>
          <span class="stat-value" id="stat-wattage">-</span>
        </div>
        <div class="card stat-card" style="--card-icon: url('images/material-design/swap-vertical-circle.svg');">
          <div class="stat-card-header">
            <span class="stat-label">Total Frames</span>
          </div>
          <span class="stat-value" id="stat-total">-</span>
        </div>
        <div class="card stat-card" style="--card-icon: url('images/material-design/lightning-bolt-circle.svg');">
          <div class="stat-card-header">
            <span class="stat-label">Power Frames</span>
          </div>
          <span class="stat-value" id="stat-power">-</span>
        </div>
        <div class="card stat-card" style="--card-icon: url('images/material-design/contactless-payment-circle.svg');">
          <div class="stat-card-header">
            <span class="stat-label">Announce Frames</span>
          </div>
          <span class="stat-value" id="stat-announce">-</span>
        </div>
        <div class="card stat-card" style="--card-icon: url('images/material-design/dots-vertical-circle.svg');">
          <div class="stat-card-header">
            <span class="stat-label">Registry Frames</span>
          </div>
          <span class="stat-value" id="stat-nodetable">-</span>
        </div>
        <div class="card stat-card" style="--card-icon: url('images/material-design/alert-circle.svg');">
          <div class="stat-card-header">
            <span class="stat-label">CRC Errors</span>
          </div>
          <span class="stat-value" id="stat-crc">-</span>
        </div>
        <div class="card stat-card" style="--card-icon: url('images/material-design/solar-panel.svg');">
          <div class="stat-card-header">
            <span class="stat-label">PV Nodes</span>
          </div>
          <span class="stat-value" id="stat-nodes">-</span>
        </div>
        <div class="card stat-card" style="--card-icon: url('images/material-design/clock.svg');">
          <div class="stat-card-header">
            <span class="stat-label">Uptime</span>
          </div>
          <span class="stat-value" id="uptime">-</span>
        </div>
      </div>
    </section>

    <section>
      <h2>Live Power Metrics</h2>
      <div class="power-grid" id="power-grid">
        <!-- Power cards will be injected here -->
      </div>
    </section>

    <section id="tap-section" style="display: none;">
      <h2>Gateways (TAP)</h2>
      <div class="power-grid" id="tap-grid"></div>
    </section>
    <section id="health-section" style="display: none;">
      <h2>Device Health</h2>
      <div class="power-grid">
        <div class="card power-card tap-card" id="health-card"></div>
      </div>
    </section>
    <section>
      <h2>Discovery Registry</h2>
      <div style="overflow-x: auto;">
        <table class="card">
          <thead>
            <tr>
              <th>ID</th>
              <th>Address</th>
              <th>Barcode</th>
              <th>Last Seen</th>
            </tr>
          </thead>
          <tbody id="discovery-table">
            <!-- Discovery rows will be injected here -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    let serverUptimeMs = 0;
    let lastUpdateLocalTime = Date.now();
    let lastFetchTime = Date.now();
    let initialVersion = null;
    let initialFsVersion = null;

    function updateStatus() {
      const now = Date.now();
      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');

      // Only transition to 'Stale' if not currently 'Disconnected'
      if (now - lastFetchTime > 15000 && !statusBadge.classList.contains('status-disconnected')) {
        statusBadge.className = 'status-badge status-stale';
        statusText.innerText = 'Stale';
      }
    }

    function updateUptime() {
      const diff = Math.floor((serverUptimeMs + (Date.now() - lastUpdateLocalTime)) / 1000);
      const days = Math.floor(diff / 86400);
      const hrs = Math.floor((diff % 86400) / 3600);
      const mins = Math.floor((diff % 3600) / 60);
      const secs = diff % 60;
      document.getElementById('uptime').innerText =
        `${days > 0 ? days + 'd ' : ''}${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function formatAddress(address) {
      return address.toString(16).toUpperCase().padStart(2, '0');
    }

    let fetching = false;

    async function fetchData() {
      // One request at a time, with a timeout: a request the device never
      // answers must not block the browser's few connections to it.
      if (fetching) return;
      fetching = true;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4500);
      try {
        const response = await fetch('/json', { signal: ctrl.signal });
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();

        if (initialVersion === null && data.version) initialVersion = data.version;
        if (initialFsVersion === null && data.fs_version) initialFsVersion = data.fs_version;

        if ((initialVersion && data.version && initialVersion !== data.version) ||
          (initialFsVersion && data.fs_version && initialFsVersion !== data.fs_version)) {
          console.log('Version change detected. Reloading page...');
          location.reload();
          return;
        }

        lastFetchTime = Date.now();
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        statusBadge.className = 'header-pill status-live';
        statusText.innerText = 'Live';

        // Trigger pulse animation
        statusDot.classList.remove('pulse');
        void statusDot.offsetWidth; // Force reflow
        statusDot.classList.add('pulse');

        if (data.uptime_ms) {
          serverUptimeMs = data.uptime_ms;
          lastUpdateLocalTime = Date.now();
        }

        // Update Platform Info
        if (data.version) {
          document.getElementById('build-version').innerText = `v${data.version}`;
          if (data.build_timestamp) {
            document.getElementById('build-version').title = `Build: ${data.build_timestamp}`;
          }
        }

        // Update MQTT status
        const mqttBadge = document.getElementById('mqtt-badge');
        if (data.mqtt && data.mqtt.enabled) {
          mqttBadge.style.display = 'flex';
          mqttBadge.className = 'header-pill ' + (data.mqtt.connected ? 'status-live' : 'status-disconnected');
          mqttBadge.title = data.mqtt.connected
            ? `MQTT connected – ${data.mqtt.published.toLocaleString()} messages published`
            : 'MQTT broker not connected';
        } else {
          mqttBadge.style.display = 'none';
        }

        // Update Stats
        if (data.stats) {
          document.getElementById('stat-total').innerText = data.stats.total_frames.toLocaleString();
          document.getElementById('stat-power').innerText = data.stats.power_count.toLocaleString();
          document.getElementById('stat-announce').innerText = data.stats.announce_count.toLocaleString();
          document.getElementById('stat-nodetable').innerText = data.stats.nodetable_count.toLocaleString();
          const crcStat = document.getElementById('stat-crc');
          crcStat.innerText = data.stats.crc_errors.toLocaleString();
          crcStat.style.color = data.stats.crc_errors > 0 ? 'var(--warning)' : '';
        }

        if (data.nodes && data.power) {
          const found = Math.max(data.power.length, data.nodes.filter(n => n.barcode_fragment > 0).length);
          const expected = data.nodes.filter(n => n.barcode && n.barcode.length > 0).length;
          document.getElementById('stat-nodes').innerText = `${found}${expected > 0 ? '/' + expected : ''}`;
        }

        // Update Power Grid
        const powerGrid = document.getElementById('power-grid');
        let totalWattage = 0;
        const barcodeById = new Map((data.nodes || []).filter(n => n.barcode).map(n => [n.pv_node_id, n.barcode]));
        powerGrid.innerHTML = data.power.map(p => {
          const lastUpdated = p.last_updated ? p.last_updated : 0;
          const ageSeconds = (data.uptime_ms - lastUpdated) / 1000;
          const isStale = ageSeconds > 60; // Stale if older than 60s
          const watts = p.voltage_out * p.current_in;

          if (!isStale) {
            totalWattage += watts;
          }

          // Calculate actual time of last update
          const updateTime = new Date(Date.now() - (ageSeconds * 1000));
          const timeString = updateTime.toLocaleTimeString();

          return `
                    <div class="card power-card ${isStale ? 'stale' : ''}">
                        <div class="card-header">
                            <span class="node-id">${p.pv_node_id}${barcodeById.has(p.pv_node_id) ? `<span class="card-barcode">${barcodeById.get(p.pv_node_id)}</span>` : ''}</span>
                            <span class="address">${formatAddress(p.address)}</span>
                        </div>
                        <div class="card-body">
                            <div class="metric">
                                <span class="metric-label">Power</span>
                                <span class="metric-value power" ${watts > 0 ? 'style="color: var(--primary);"' : ''}>${watts.toFixed(1)} W</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">RSSI</span>
                                <span class="metric-value">${p.rssi} dBm</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">V In</span>
                                <span class="metric-value">${p.voltage_in.toFixed(1)} V</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">V Out</span>
                                <span class="metric-value">${p.voltage_out.toFixed(1)} V</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Current</span>
                                <span class="metric-value">${p.current_in.toFixed(2)} A</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Temp</span>
                                <span class="metric-value">${p.temperature.toFixed(1)} °C</span>
                            </div>
                            <div class="updated">
                                <span class="stale-badge">Stale</span>
                                <span class="timestamp">${timeString}</span>
                            </div>
                        </div>
                    </div>
                `
        }).join('');

        // Update total wattage.
        const wattage = document.getElementById('stat-wattage');
        wattage.innerText = `${totalWattage.toLocaleString([], { maximumFractionDigits: 0 })} W`;
        wattage.style.color = totalWattage > 0 ? 'var(--primary)' : '';

        // Update TAPs
        const taps = data.taps || [];
        document.getElementById('tap-section').style.display = taps.length ? '' : 'none';
        const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        document.getElementById('tap-grid').innerHTML = taps.map(t => {
          const stateLabel = t.state === 'ok' ? 'Online'
            : t.state === 'degraded' ? 'Missing polls' : 'Offline';
          const metric = (label, value, wide) => `
                            <div class="metric${wide ? ' wide' : ''}">
                                <span class="metric-label">${label}</span>
                                <span class="metric-value">${value}</span>
                            </div>`;
          const lastSeen = t.last_seen_s === undefined ? 'never'
            : t.last_seen_s < 2 ? 'just now' : `${t.last_seen_s} s ago`;
          return `
                    <div class="card power-card tap-card">
                        <div class="card-header">
                            <span class="node-id">TAP ${esc(t.id)}</span>
                            <span class="tap-state ${esc(t.state)}">${stateLabel}</span>
                        </div>
                        <div class="card-body">
                            ${metric('Polls answered', t.recent_answered_pct === undefined ? '–' : `${t.recent_answered_pct} %`)}
                            ${metric('Modules', t.modules)}
                            ${metric('Avg. module signal', t.rssi_avg === undefined ? '–' : `${t.rssi_avg} (min ${t.rssi_min})`)}
                            ${metric('Last response', lastSeen)}
                            ${metric('Rx buffers used', t.rx_buffers_used === undefined ? '–' : `${t.rx_buffers_used} (max ${t.rx_buffers_max})`)}
                            ${metric('Tx buffers free', t.tx_buffers_free === undefined ? '–' : `${t.tx_buffers_free}${t.tx_buffers_min !== undefined ? ` (min ${t.tx_buffers_min})` : ''}`)}
                            ${metric('Missed polls', `${t.missed.toLocaleString()} of ${t.polls.toLocaleString()}`)}
                            ${metric('Radio', t.radio_channel === undefined ? '–' : `Ch ${t.radio_channel}, PAN ${esc(t.pan_id)}`)}
                            ${t.barcode ? metric('Barcode', `<span class="barcode">${esc(t.barcode)}</span>`, true) : ''}
                            ${t.version ? metric('Firmware', esc(t.version), true) : ''}
                        </div>
                    </div>`;
        }).join('');

        // Update device health
        const sys = data.system;
        document.getElementById('health-section').style.display = sys ? '' : 'none';
        if (sys) {
          const kb = (b) => b === undefined ? '–' : `${(b / 1024).toFixed(0)} KB`;
          const dur = (s) => s === undefined ? '–'
            : s >= 86400 ? `${Math.floor(s / 86400)}d ${Math.floor((s % 86400) / 3600)}h`
              : s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`
                : `${Math.floor(s / 60)}m ${s % 60}s`;
          const m = (label, value, wide) => `
                <div class="metric${wide ? ' wide' : ''}">
                  <span class="metric-label">${label}</span>
                  <span class="metric-value">${value}</span>
                </div>`;
          const prev = sys.previous_run;
          const w = sys.wifi || {};
          document.getElementById('health-card').innerHTML = `
              <div class="card-header">
                <span class="node-id">${esc(data.version || '')}</span>
                <span class="tap-state ${w.connected ? 'ok' : 'offline'}">${w.connected ? 'WiFi ' + w.rssi + ' dBm' : 'WiFi down'}</span>
              </div>
              <div class="card-body">
                ${m('Last restart', esc(sys.reset_reason), true)}
                ${prev ? m('Previous run', `${dur(prev.uptime_s)}, lowest free memory ${kb(prev.heap_min)}${prev.restart_cause ? ', ' + esc(prev.restart_cause) : ''}`, true) : ''}
                ${m('Free memory', `${kb(sys.heap_free)} (min ${kb(sys.heap_min)})`)}
                ${m('Largest block', `${kb(sys.heap_max_block)} (min ${kb(sys.heap_max_block_min)})`)}
                ${m('WiFi drops', `${w.disconnects ?? 0}${w.last_disconnect_reason ? ' (last reason ' + w.last_disconnect_reason + ')' : ''}`)}
                ${m('Connected for', w.connected ? dur(w.connected_s) : '–')}
                ${sys.crash_count ? m(`Crash reports (${sys.crash_count})`, `<span class="barcode">${esc(sys.last_crash)}</span>`, true) : ''}
              </div>`;

          const alertEl = document.getElementById('health-alert');
          const bad = /Crash|watchdog|Brownout|glitch|lockup/i.test(sys.reset_reason || '');
          const healed = prev && prev.restart_cause;
          if (bad || healed) {
            alertEl.style.display = '';
            alertEl.innerHTML = `<strong>TigoTell restarted ${dur(sys.uptime_s)} ago: ${esc(healed ? prev.restart_cause : sys.reset_reason)}</strong>`
              + (prev ? `The previous run lasted ${dur(prev.uptime_s)}. ` : '')
              + 'Details under Device Health below.';
          } else {
            alertEl.style.display = 'none';
          }
        }

        // Update Discovery Table
        const discoveryTable = document.getElementById('discovery-table');
        discoveryTable.innerHTML = data.nodes.map(n => `
                    <tr>
                        <td class="node_id">${n.pv_node_id}</td>
                        <td class="address">${n.address > 0 ? formatAddress(n.address) : '-'}</td>
                        <td class="barcode">${n.barcode ? n.barcode : (n.barcode_fragment && n.barcode_fragment > 0 ? n.barcode_fragment.toString(16).toUpperCase().padStart(6, '0').padStart(16, '?') : '-')}</td>
                        <td class="last-seen">${n.last_seen_ms > 0 ? new Date(Date.now() - (data.uptime_ms - n.last_seen_ms)).toLocaleTimeString() : '-'}</td>
                    </tr >
                `).join('');

      } catch (error) {
        console.error('Error fetching data:', error);
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        statusBadge.className = 'header-pill status-disconnected';
        statusText.innerText = 'Disconnected';
      } finally {
        clearTimeout(timer);
        fetching = false;
      }
    }

    const updateCheckBtn = document.getElementById('update-check-btn');
    const updateBadge = document.getElementById('update-available-badge');

    async function checkUpdates() {
      updateCheckBtn.style.opacity = '0.5';
      updateCheckBtn.style.pointerEvents = 'none';
      try {
        const response = await fetch('/api/update/check');
        const data = await response.json();
        if (data.update_available) {
          updateBadge.style.display = 'inline-block';
          updateBadge.title = `Update available: v${data.latest_version}. Click to install.`;
        } else {
          updateBadge.style.display = 'none';
          if (!data.error) alert('System is up to date.');
        }

        if (data.error) console.error('Update check error:', data.error);
      } catch (err) {
        console.error('Failed to check for updates:', err);
      } finally {
        updateCheckBtn.style.opacity = '1';
        updateCheckBtn.style.pointerEvents = 'auto';
      }
    }

    updateCheckBtn.onclick = (e) => {
      e.stopPropagation();
      checkUpdates();
    };

    updateBadge.onclick = async () => {
      if (confirm('Start full system update from GitHub (Firmware + FileSystem)? The device will reboot when finished.')) {
        try {
          updateBadge.innerText = 'Updating...';
          updateBadge.style.background = 'var(--warning)';
          await fetch('/api/update/execute', { method: 'POST' });
          alert('Update started. Check WebSerial for progress. The device will reboot automatically.');
        } catch (err) {
          alert('Failed to start update.');
          updateBadge.innerText = 'Update Available';
          updateBadge.style.background = 'var(--primary)';
        }
      }
    };

    setInterval(fetchData, 5000);
    setInterval(updateUptime, 1000);
    setInterval(updateStatus, 1000);
    fetchData();
  </script>
</body>

</html>
